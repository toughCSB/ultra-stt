name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  availability:
    name: CodeQL unavailable — analysis not performed
    if: github.event.repository.private && vars.CODEQL_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain unsupported private-repository configuration
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## CodeQL analysis not performed

          CodeQL is on hold for this private repository. This is not a security scan or a passing security result.
          The current personal private repository is not eligible for GitHub Code Security code scanning.
          No subscription, visibility change, or additional credentials were applied.

          If an eligible organization later enables GitHub Code Security, set the repository variable
          `CODEQL_ENABLED` to `true` to opt in. Public repositories run analysis automatically.

          [GitHub eligibility documentation](https://docs.github.com/en/code-security/concepts/code-scanning/codeql/codeql-code-scanning)
          EOF

  analyze-javascript:
    if: github.event.repository.private == false || vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v3
